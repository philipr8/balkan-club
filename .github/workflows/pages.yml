# Deploys /docs to GitHub Pages and generates the (gitignored) Firebase config
# from the FIREBASE_CONFIG_JSON repository secret, so no key is ever committed.
#
# One-time switch required: repo Settings → Pages → Build and deployment →
# Source = "GitHub Actions". See FIREBASE_SETUP.md, step 9.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Write Firebase config from secret
        env:
          FIREBASE_CONFIG_JSON: ${{ secrets.FIREBASE_CONFIG_JSON }}
        run: |
          if [ -n "$FIREBASE_CONFIG_JSON" ]; then
            # Validate it is real JSON before publishing it.
            echo "$FIREBASE_CONFIG_JSON" | python3 -c 'import json,sys; json.load(sys.stdin)'
            printf 'export default %s;\n' "$FIREBASE_CONFIG_JSON" > docs/firebase-config.js
            echo "Firebase config written."
          else
            echo "FIREBASE_CONFIG_JSON not set — Exec area will show 'not configured'. Public site is unaffected."
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
